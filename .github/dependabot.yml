version: 2
# Weekly, grouped, quiet (owner, 2026-11-26: "not so damn much daily prs"): every ecosystem on
# Monday, minor+patch as ONE pull request per ecosystem, security updates batched into one more per
# ecosystem, majors individually, at most 3 open version-update PRs per ecosystem (security updates
# open when an alert fires, under Dependabot's own separate cap). The developerz.ai maintainer agent
# reviews them and merges on a green "CI OK" (.dz/maintainer/maintainer.yml). cooldown: a release
# must be 14 days old before it is proposed, so broken or compromised releases are usually yanked
# first. Security updates skip it.
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    groups:
      bun-minor:
        update-types: ["minor", "patch"]
      bun-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    groups:
      actions-minor:
        update-types: ["minor", "patch"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
