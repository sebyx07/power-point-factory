name: ci
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  # One group per pull request; every other run gets its own group, because a shared group
  # drops a queued run when a third one arrives, even with cancel-in-progress off.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read

jobs:
  check:
    # the required check the maintainer merges on (.dz/maintainer/maintainer.yml)
    name: CI OK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version-file: .bun-version }
      # The same two commands a developer runs. bin/setup installs the renderer
      # (LibreOffice, poppler), the metric-compatible fonts and the locked dependencies.
      - run: bin/setup
      - run: bin/check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: decks
          path: |
            out/**/*.pdf
            out/**/*-contact-sheet.png
            out/**/*-qa.md
